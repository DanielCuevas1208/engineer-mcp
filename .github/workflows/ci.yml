name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: verify on Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify the demo runs
        run: npm run demo

      - name: Verify the CLI list pipes to standard output
        run: |
          node dist/index.js --version
          for tool in beam_bending section_properties bolt_strength interference_fit spring_design shaft_analysis bearing_life von_mises fatigue_analysis fatigue_damage unit_convert material_lookup; do
            node dist/index.js --list | grep -q "$tool" || { echo "Missing tool: $tool"; exit 1; }
          done

      - name: Verify the extended unit catalog
        run: |
          node --input-type=module <<'NODE'
          import { convertUnit } from "./dist/units/index.js";

          const cases = [
            [1, "Pa.s", "cP", 1000],
            [1, "cSt", "m2/s", 1e-6],
            [1, "W/cmK", "W/mK", 100],
          ];

          for (const [value, from, to, expected] of cases) {
            const outcome = convertUnit(value, from, to);
            if (!outcome.ok || Math.abs(outcome.value - expected) > Math.max(1e-12, Math.abs(expected) * 1e-9)) {
              throw new Error("Unit check failed: " + from + " to " + to);
            }
          }
          NODE

      - name: Verify the package contents
        run: npm pack --dry-run
